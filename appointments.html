<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upcoming Appointments</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="appointments-page">
    <div class="page-header">
      <h2>Upcoming Appointments</h2>
      <div class="top-actions">
        <button onclick="goBack()">Book Appointment</button>
        <button class="secondary-btn" onclick="logout()">Logout</button>
      </div>
    </div>

    <div class="filter-row">
      <label for="filter">Filter by:</label>
      <select id="filter" onchange="renderAppointments()">
        <option value="All">All</option>
        <option value="Confirmed">Confirmed</option>
        <option value="Pending">Pending</option>
        <option value="Cancelled">Cancelled</option>
      </select>
    </div>

    <div class="appointments-layout">
      <div class="appointments-left card">
        <h3>Upcoming Appointments</h3>

        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Time</th>
              <th>Provider</th>
              <th>Service</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="appointmentsTableBody">
          </tbody>
        </table>

        <p id="appointmentsMessage" class="message"></p>

        <div class="actions-box">
          <h3>Actions</h3>
          <div class="button-row">
            <button onclick="confirmSelected()">Confirm</button>
            <button class="secondary-btn" onclick="cancelSelected()">Cancel</button>
          </div>
        </div>
      </div>

      <div class="appointments-right card">
        <h3>Details</h3>
        <div class="detail-line">Selected appointment:</div>
        <div class="detail-line">Date & Time: <span id="detailDateTime">None</span></div>
        <div class="detail-line">Provider: <span id="detailProvider">None</span></div>
        <div class="detail-line">Service: <span id="detailService">None</span></div>
        <div class="detail-line">Status: <span id="detailStatus">None</span></div>
      </div>
    </div>
  </div>

  <script>
    let selectedAppointmentId = null;

    function getAppointments() {
      return JSON.parse(localStorage.getItem("appointments")) || [];
    }

    function saveAppointments(appointments) {
      localStorage.setItem("appointments", JSON.stringify(appointments));
    }

    function renderAppointments() {
      const tbody = document.getElementById("appointmentsTableBody");
      const filterValue = document.getElementById("filter").value;
      const appointments = getAppointments();

      tbody.innerHTML = "";

      const filteredAppointments = filterValue === "All"
        ? appointments
        : appointments.filter(app => app.status === filterValue);

      if (filteredAppointments.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5">No appointments found.</td>
          </tr>
        `;
        return;
      }

      filteredAppointments.forEach(app => {
        const row = document.createElement("tr");
        if (app.id === selectedAppointmentId) {
          row.classList.add("selected-row");
        }

        row.innerHTML = `
          <td>${app.date}</td>
          <td>${app.time}</td>
          <td>${app.provider}</td>
          <td>${app.service}</td>
          <td>${app.status}</td>
        `;

        row.onclick = () => selectAppointment(app.id);
        tbody.appendChild(row);
      });
    }

    function selectAppointment(id) {
      selectedAppointmentId = id;
      const appointments = getAppointments();
      const selected = appointments.find(app => app.id === id);

      if (!selected) return;

      document.getElementById("detailDateTime").textContent = `${selected.date} at ${selected.time}`;
      document.getElementById("detailProvider").textContent = selected.provider;
      document.getElementById("detailService").textContent = selected.service;
      document.getElementById("detailStatus").textContent = selected.status;

      renderAppointments();
    }

    function confirmSelected() {
      const message = document.getElementById("appointmentsMessage");

      if (!selectedAppointmentId) {
        message.textContent = "Please select an appointment first.";
        message.className = "message error";
        return;
      }

      const appointments = getAppointments();
      const index = appointments.findIndex(app => app.id === selectedAppointmentId);

      if (index === -1) return;

      appointments[index].status = "Confirmed";
      saveAppointments(appointments);

      document.getElementById("detailStatus").textContent = "Confirmed";
      message.textContent = "Appointment marked as confirmed.";
      message.className = "message success";

      renderAppointments();
    }

    function cancelSelected() {
      const message = document.getElementById("appointmentsMessage");

      if (!selectedAppointmentId) {
        message.textContent = "Please select an appointment first.";
        message.className = "message error";
        return;
      }

      const appointments = getAppointments();
      const index = appointments.findIndex(app => app.id === selectedAppointmentId);

      if (index === -1) return;

      appointments[index].status = "Cancelled";
      saveAppointments(appointments);

      document.getElementById("detailStatus").textContent = "Cancelled";
      message.textContent = "Appointment marked as cancelled.";
      message.className = "message success";

      renderAppointments();
    }

    function goBack() {
      window.location.href = "booking.html";
    }

    function logout() {
      window.location.href = "index.html";
    }

    renderAppointments();
  </script>
</body>
</html>
