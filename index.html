<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartCare Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="login-container">
    <h2>SmartCare Login</h2>

    <input type="text" id="username" placeholder="Email/Username" />
    <input type="password" id="password" placeholder="Password" />

    <button onclick="login()">Login</button>

    <p id="loginMessage" class="message error"></p>

    <br />
    <a href="#">Forgot password?</a>
  </div>

  <script>
    function login() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const loginMessage = document.getElementById("loginMessage");

      if (!username || !password) {
        loginMessage.textContent = "Please enter both username/email and password.";
        return;
      }

      loginMessage.textContent = "";
      window.location.href = "booking.html";
    }
  </script>

</body>
</html>
