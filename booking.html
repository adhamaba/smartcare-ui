<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Appointment</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-header">
    <h2>Book Appointment</h2>
    <div class="top-actions">
      <button onclick="goToAppointments()">View Appointments</button>
      <button class="secondary-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="layout">
    <div class="left-panel card">
      <label for="provider">Provider</label><br />
      <select id="provider">
        <option value="">Select Provider</option>
        <option>Dr Smith</option>
        <option>Dr Lee</option>
        <option>Dr Patel</option>
      </select>

      <br /><br />

      <label for="service">Service</label><br />
      <select id="service">
        <option value="">Select Service</option>
        <option>General Checkup</option>
        <option>Dental</option>
        <option>Consultation</option>
      </select>

      <br /><br />

      <label for="date">Date</label><br />
      <input type="date" id="date" />

      <h3>Available Time Slots</h3>

      <table>
        <tr>
          <th>Time</th>
          <th>Provider</th>
          <th>Status</th>
        </tr>

        <tr>
          <td>10:00</td>
          <td>Dr Smith</td>
          <td><button class="slot-btn unavailable" onclick="selectUnavailable()">Unavailable</button></td>
        </tr>

        <tr id="row-11">
          <td>11:00</td>
          <td>Dr Lee</td>
          <td><button class="slot-btn" onclick="selectTime('11:00', 'Dr Lee', 'row-11')">Select</button></td>
        </tr>

        <tr id="row-12">
          <td>12:00</td>
          <td>Dr Patel</td>
          <td><button class="slot-btn" onclick="selectTime('12:00', 'Dr Patel', 'row-12')">Select</button></td>
        </tr>
      </table>
    </div>

    <div class="right-panel card">
      <h3>Appointment Summary</h3>

      <div class="summary">
        <p>Provider: <span id="selectedProvider">None</span></p>
        <p>Service: <span id="selectedService">None</span></p>
        <p>Date: <span id="selectedDate">None</span></p>
        <p>Time: <span id="selectedTime">None</span></p>
      </div>

      <p id="bookingMessage" class="message"></p>

      <div class="button-group">
        <button onclick="confirmAppointment()">Confirm Appointment</button>
        <button class="secondary-btn" onclick="clearAppointment()">Clear Selection</button>
      </div>
    </div>
  </div>

  <script>
    let selectedTimeValue = "";
    let selectedProviderValue = "";
    let selectedRowId = "";

    function removeRowHighlights() {
      const rows = document.querySelectorAll("table tr");
      rows.forEach(row => row.classList.remove("selected-row"));
    }

    function selectTime(time, slotProvider, rowId) {
      const service = document.getElementById("service").value;
      const date = document.getElementById("date").value;
      const message = document.getElementById("bookingMessage");

      if (!date) {
        message.textContent = "Please select a date before choosing a time slot.";
        message.className = "message error";
        return;
      }

      if (!service) {
        message.textContent = "Please select a service before choosing a time slot.";
        message.className = "message error";
        return;
      }

      selectedTimeValue = time;
      selectedProviderValue = slotProvider;
      selectedRowId = rowId;

      removeRowHighlights();
      document.getElementById(rowId).classList.add("selected-row");

      document.getElementById("provider").value = slotProvider;
      document.getElementById("selectedProvider").innerText = slotProvider;
      document.getElementById("selectedService").innerText = service;
      document.getElementById("selectedDate").innerText = date;
      document.getElementById("selectedTime").innerText = time;

      message.textContent = "Time slot selected successfully.";
      message.className = "message success";
    }

    function selectUnavailable() {
      const message = document.getElementById("bookingMessage");
      message.textContent = "This time slot is unavailable. Please choose another slot.";
      message.className = "message error";
    }

    function confirmAppointment() {
      const provider = document.getElementById("provider").value;
      const service = document.getElementById("service").value;
      const date = document.getElementById("date").value;
      const message = document.getElementById("bookingMessage");

      if (!provider || !service || !date || !selectedTimeValue) {
        message.textContent = "Please complete all required appointment details before confirming.";
        message.className = "message error";
        return;
      }

      const appointments = JSON.parse(localStorage.getItem("appointments")) || [];

      const newAppointment = {
        id: Date.now(),
        provider: provider,
        service: service,
        date: date,
        time: selectedTimeValue,
        status: "Confirmed"
      };

      appointments.push(newAppointment);
      localStorage.setItem("appointments", JSON.stringify(appointments));

      document.getElementById("selectedProvider").innerText = provider;
      document.getElementById("selectedService").innerText = service;
      document.getElementById("selectedDate").innerText = date;
      document.getElementById("selectedTime").innerText = selectedTimeValue;

      message.textContent = "Appointment confirmed successfully and saved to Upcoming Appointments.";
      message.className = "message success";
    }

    function clearAppointment() {
      document.getElementById("provider").value = "";
      document.getElementById("service").value = "";
      document.getElementById("date").value = "";

      document.getElementById("selectedProvider").innerText = "None";
      document.getElementById("selectedService").innerText = "None";
      document.getElementById("selectedDate").innerText = "None";
      document.getElementById("selectedTime").innerText = "None";

      selectedTimeValue = "";
      selectedProviderValue = "";
      selectedRowId = "";

      removeRowHighlights();

      const message = document.getElementById("bookingMessage");
      message.textContent = "Appointment selection cleared.";
      message.className = "message";
    }

    function goToAppointments() {
      window.location.href = "appointments.html";
    }

    function logout() {
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
